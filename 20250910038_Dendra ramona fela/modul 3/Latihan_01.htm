<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 01</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #fdf2f2, #f0f6ff);
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: rgb(255, 0, 0);
            margin: 0 0 20px;
        }

        h2, h3 {
            margin: 10px 0;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>
    </div>
</body>
</html>
